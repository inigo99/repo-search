name: Update index

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  push:
    branches: [main]
    paths: [scripts/**, data/apps.json, .github/workflows/update-index.yml]
  workflow_dispatch:

permissions:
  contents: write

# A newer run (e.g. after a push) replaces one still running.
concurrency:
  group: update-index
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python scripts/test_build.py
      - run: python scripts/build_index.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node test.js
      - run: node scripts/build_pages.js
      - name: Commit if changed
        run: |
          git add data/ alternatives/ sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update index and alternative pages"
          git pull --rebase origin main
          git push
